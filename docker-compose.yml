name: tracemark

services:
  postgres:
    image: postgres:17-alpine
    container_name: tracemark-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-tracemark}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-tracemark_test}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Emulador S3 opcional para desenvolvimento local (docker compose --profile storage up -d)
  s3:
    image: chrislusf/seaweedfs:4.50
    container_name: tracemark-s3
    restart: unless-stopped
    profiles: ["storage"]
    command: server -dir=/data -s3 -s3.port=8333 -master.volumeSizeLimitMB=64 -volume.max=8
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?defina AWS_ACCESS_KEY_ID no .env para o emulador local}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?defina AWS_SECRET_ACCESS_KEY no .env para o emulador local}
    ports:
      - "${S3_LOCAL_PORT:-8333}:8333"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  postgres-data:
  s3-data:
